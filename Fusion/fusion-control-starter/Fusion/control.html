<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FUSION · Control</title>
  <link rel="icon" type="image/png" href="/Logo.png">
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#111620;--panel2:#171e2a;--line:#273243;--text:#f3f5f8;--muted:#98a4b7;--blue:#426dff;--green:#36c98b;--amber:#f3b84f;--red:#f06a73}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 480px at 15% -10%,#18223b 0%,transparent 60%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1240px;margin:auto;padding:28px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border:1px solid #34425c;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-1px;background:linear-gradient(145deg,#27365b,#111620)}.brand strong{display:block;letter-spacing:.16em;font-size:13px}.brand small{color:var(--muted)}.topActions{display:flex;gap:10px;align-items:center}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn:disabled{opacity:.6;cursor:not-allowed}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.hero h1{font-size:clamp(24px,4vw,34px);margin:0 0 5px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.stat,.panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,rgba(23,30,42,.96),rgba(15,20,29,.96));box-shadow:0 12px 35px #0002}.stat{padding:17px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;line-height:1.3;margin-top:8px}.panel{overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar h2{font-size:15px;margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap}.field{background:#0b1018;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 11px;min-width:150px}.search{min-width:220px}.list{padding:0}.order{padding:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1.1fr 1.5fr 1fr;gap:14px;align-items:start}.order:last-child{border-bottom:0}.order h3{font-size:13px;margin:0 0 4px}.order p{margin:3px 0;color:var(--muted);overflow-wrap:anywhere}.items{color:#d7deea;font-size:12px}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;border:1px solid var(--line);text-transform:capitalize}.status.pending{color:var(--amber);border-color:#735925}.status.confirmed{color:#9eb7ff;border-color:#344e96}.status.shipped{color:#b7a0ff;border-color:#59478c}.status.delivered{color:var(--green);border-color:#27674f}.status.cancelled{color:var(--red);border-color:#71373e}.order select{width:100%;margin-top:8px;min-width:0}.empty,.notice{padding:28px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;text-align:left;border-radius:9px;margin:0 0 12px;background:#18243a;color:#c9d6f5}.error{background:#331c24;color:#ffc4c8}.login{max-width:420px;margin:10vh auto;padding:24px}.login h1{margin:0 0 5px}.login p{color:var(--muted);margin:0 0 18px}.login label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.login input{width:100%}.login button{width:100%;margin-top:15px}.hidden{display:none!important}.foot{color:#647084;text-align:center;font-size:11px;margin-top:18px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.order{grid-template-columns:1fr 1fr}.search{min-width:170px}}
    @media(max-width:520px){.wrap{padding:18px 12px 40px}.hero{align-items:start;flex-direction:column}.top{align-items:start}.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.order{grid-template-columns:1fr;gap:9px}.filters{width:100%}.filters>*{flex:1}.search{min-width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="mark">F</div><div><strong>FUSION</strong><small>Order management</small></div></div>
      <div class="topActions"><span class="muted" id="today"></span><button class="btn hidden" id="logoutBtn">Sign out</button></div>
    </header>

    <section class="panel login" id="loginPanel">
      <h1>Welcome back.</h1><p>Sign in to manage store orders.</p>
      <div id="loginMessage" class="notice hidden" role="alert"></div>
      <form id="loginForm"><label for="password">Admin password</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn primary" type="submit" id="loginBtn">Sign in</button></form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="hero"><div><h1>Orders overview</h1><p>Review incoming orders and update their status.</p></div><button class="btn" id="refreshBtn">↻ Refresh orders</button></div>
      <div id="pageMessage" class="notice hidden" role="status"></div>
      <div class="grid">
        <article class="stat"><span>Total orders</span><strong id="totalCount">0</strong></article>
        <article class="stat"><span>New · Pending</span><strong id="pendingCount">0</strong></article>
        <article class="stat"><span>In progress</span><strong id="progressCount">0</strong></article>
        <article class="stat"><span>Delivered</span><strong id="deliveredCount">0</strong></article>
      </div>
      <section class="panel">
        <div class="toolbar"><h2>All orders</h2><div class="filters"><input class="field search" id="searchInput" type="search" placeholder="Search name, phone, order ID"><select class="field" id="statusFilter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div></div>
        <div class="list" id="ordersList"><div class="empty">Loading orders…</div></div>
      </section>
    </section>
    <div class="foot">FUSION · Private admin area</div>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const statuses = ["pending", "confirmed", "shipped", "delivered", "cancelled"];
  let allOrders = [];
  const escDate = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? "" : date.toLocaleString(); };
  function message(id, text, error = false) { const el = $(id); el.textContent = text; el.classList.remove("hidden", "error"); if (error) el.classList.add("error"); }
  function hideMessage(id) { $(id).classList.add("hidden"); }
  async function api(url, options = {}) {
    const response = await fetch(url, { credentials: "same-origin", ...options, headers: { ...(options.body ? {"Content-Type":"application/json"} : {}), ...(options.headers || {}) } });
    let data = {}; try { data = await response.json(); } catch {}
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
    return data;
  }
  function showDashboard() { $("loginPanel").classList.add("hidden"); $("dashboard").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden"); }
  function showLogin() { $("dashboard").classList.add("hidden"); $("loginPanel").classList.remove("hidden"); $("logoutBtn").classList.add("hidden"); }
  function renderOrders() {
    const term = $("searchInput").value.trim().toLowerCase();
    const status = $("statusFilter").value;
    const filtered = allOrders.filter(order => {
      const matchesStatus = status === "all" || order.status === status;
      const haystack = [order.id, order.customer_name, order.phone, order.address].join(" ").toLowerCase();
      return matchesStatus && haystack.includes(term);
    });
    const list = $("ordersList"); list.replaceChildren();
    if (!filtered.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No orders found."; list.append(empty); return; }
    for (const order of filtered) {
      const card = document.createElement("article"); card.className = "order";
      const identity = document.createElement("div");
      const heading = document.createElement("h3"); heading.textContent = `#${order.id.slice(0, 8).toUpperCase()}`; identity.append(heading);
      const date = document.createElement("p"); date.textContent = escDate(order.created_at); identity.append(date);
      const customer = document.createElement("div");
      const customerName = document.createElement("h3"); customerName.textContent = order.customer_name; customer.append(customerName);
      const phone = document.createElement("p"); phone.textContent = order.phone; customer.append(phone);
      const address = document.createElement("p"); address.textContent = order.address; customer.append(address);
      if (order.notes) { const note = document.createElement("p"); note.textContent = `Note: ${order.notes}`; customer.append(note); }
      const items = document.createElement("div"); items.className = "items";
      for (const item of (order.items || [])) { const line = document.createElement("p"); line.textContent = `${item.quantity} × ${item.name}${item.variant ? ` · ${item.variant}` : ""}`; items.append(line); }
      const actions = document.createElement("div");
      const badge = document.createElement("span"); badge.className = `status ${order.status}`; badge.textContent = order.status; actions.append(badge);
      const select = document.createElement("select"); select.className = "field"; select.setAttribute("aria-label", "Change order status");
      for (const value of statuses) { const option = document.createElement("option"); option.value = value; option.textContent = value[0].toUpperCase() + value.slice(1); select.append(option); }
      select.value = order.status;
      select.addEventListener("change", async () => { select.disabled = true; try { await api(`/api/admin/orders/${encodeURIComponent(order.id)}`, { method:"PATCH", body:JSON.stringify({status:select.value}) }); await loadOrders(); message("pageMessage", "Order status updated."); } catch (error) { message("pageMessage", error.message, true); select.value = order.status; } finally { select.disabled = false; } });
      actions.append(select); card.append(identity, customer, items, actions); list.append(card);
    }
  }
  async function loadOrders() {
    hideMessage("pageMessage");
    const data = await api("/api/admin/orders"); allOrders = data.orders || [];
    $("totalCount").textContent = allOrders.length;
    $("pendingCount").textContent = allOrders.filter(o => o.status === "pending").length;
    $("progressCount").textContent = allOrders.filter(o => ["confirmed", "shipped"].includes(o.status)).length;
    $("deliveredCount").textContent = allOrders.filter(o => o.status === "delivered").length;
    renderOrders();
  }
  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault(); hideMessage("loginMessage"); $("loginBtn").disabled = true;
    try { await api("/api/admin/login", { method:"POST", body:JSON.stringify({password:$("password").value}) }); showDashboard(); await loadOrders(); $("password").value = ""; }
    catch (error) { message("loginMessage", error.message, true); }
    finally { $("loginBtn").disabled = false; }
  });
  $("logoutBtn").addEventListener("click", async () => { try { await api("/api/admin/logout", {method:"POST", body:"{}"}); } catch {} showLogin(); });
  $("refreshBtn").addEventListener("click", async () => { try { await loadOrders(); } catch (error) { message("pageMessage", error.message, true); } });
  $("searchInput").addEventListener("input", renderOrders);
  $("statusFilter").addEventListener("change", renderOrders);
  $("today").textContent = new Date().toLocaleDateString(undefined, {day:"numeric",month:"short",year:"numeric"});
  api("/api/admin/orders").then(data => { allOrders = data.orders || []; showDashboard(); loadOrders(); }).catch(() => showLogin());
</script>
</body>
</html>
